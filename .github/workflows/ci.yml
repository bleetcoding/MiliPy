name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e sdk
      - run: cd sdk && python3 -m pytest
      - run: python3 -u examples/first_bot.py --simulate
        # Runs for a few seconds against the simulator to prove the full
        # bot experience works offline.

  bridge-experimental:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - run: |
          cd experimental/bridge
          ./gradlew assembleDebug lintDebug
          ls app/build/outputs/apk/debug/app-debug.apk
